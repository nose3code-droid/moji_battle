<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>文字くいしん坊</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "opentype": "https://cdn.jsdelivr.net/npm/opentype.js@2.0.0/dist/opentype.mjs"
    }
  }
  </script>
</head>
<body>
  <header id="top">
    <a class="back" href="../../">← メインページへ</a>
    <h1>文字くいしん坊</h1>
    <div class="tools">
      <button id="btn-pause" class="sub">ポーズ</button>
      <button id="btn-menu" class="sub">面セレクト</button>
      <button id="btn-sound" class="sub" aria-label="音">音 ON</button>
    </div>
  </header>

  <section id="hud">
    <div class="stat"><small>スコア</small><b id="score">0</b></div>
    <div class="stat"><small>ハイスコア</small><b id="hi">0</b></div>
    <div class="stat"><small>面</small><b id="stage">1/5</b></div>
    <div class="stat grow"><small>ライフ</small><b id="lives"></b></div>
  </section>
  <div id="powerbar"><i id="powerfill"></i></div>

  <main id="stage-area"><canvas id="view"></canvas></main>

  <footer id="bottom">
    <div id="stick"><i id="knob"></i></div>
    <p id="help">矢印キー／WASD で移動（先に押しておくと曲がり角で曲がる）。スマホはスワイプかスティック。</p>
  </footer>

  <div id="title" class="overlay">
    <div class="card">
      <h2>文字くいしん坊</h2>
      <p class="lead">迷路の字の粒（<b id="pellet-demo">米</b>）をぜんぶ食べると面クリア。<b>鬼・幽・怪・魔</b>に触れるとライフが減る。大きな<b>力</b>を食べると、おばけが<b>弱</b>になって食べられる！</p>
      <form id="form">
        <input id="char" type="text" maxlength="2" autocomplete="off" placeholder="主人公の字（1文字）" aria-label="主人公の字">
        <button type="submit">この字で</button>
      </form>
      <div id="presets"></div>
      <div id="statbox"></div>
      <h3>はじめる面</h3>
      <div id="stages"></div>
      <div class="row"><button id="btn-start">はじめる</button></div>
      <p class="small">ハイスコア <b id="hi2">0</b> ／ 到達した面 <b id="reached">1</b></p>
    </div>
  </div>

  <div id="result" class="overlay" hidden>
    <div class="card">
      <h2 id="r-title"></h2>
      <p id="r-body"></p>
      <div class="row wrap" id="r-btns"></div>
    </div>
  </div>

  <div id="pause" class="overlay" hidden>
    <div class="card"><h2>ポーズ中</h2><div class="row"><button id="btn-resume">つづける</button></div></div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
