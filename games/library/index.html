<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>夜の文字館</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="view"></canvas>

  <a class="back" href="../../">← メインページへ</a>

  <div id="hud" hidden>
    <div id="shiori"></div>
    <div id="floor"></div>
    <div id="goal"></div>
    <div id="status"></div>
  </div>
  <div id="toast"></div>

  <div id="touch" hidden>
    <div id="stick"><i id="knob"></i></div>
    <button id="run">はしる</button>
  </div>

  <div id="dialog" hidden>
    <div id="who"></div>
    <div id="text"></div>
    <div id="next">▼ タップ / Space</div>
  </div>

  <div id="title" class="overlay">
    <div class="big"><span class="hi">ひ</span><span class="utsu">鬱</span></div>
    <h1>夜の文字館</h1>
    <p>閉館後の図書館で、小さな「ひ」が目をさました。<br>出口のかぎは館長室。大きな文字に見つからないように……。</p>
    <div class="btns">
      <button id="btn-continue">つづきから</button>
      <button id="btn-new">はじめから</button>
    </div>
    <p class="help">移動：矢印 / WASD / 画面のスティック　はしる：Shift / ボタン<br>はしると足音がひびきます。本棚やロッカーにかくれよう。</p>
  </div>

  <div id="ending" class="overlay" hidden>
    <h1>おしまい</h1>
    <p>夜があけて、文字館に朝の光がさしこみました。<br>「ひ」と「鬱」は、もうひとりじゃありません。</p>
    <div class="btns">
      <button id="btn-again">もういちど あそぶ</button>
      <a class="btn" href="../../">メインページへ</a>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
