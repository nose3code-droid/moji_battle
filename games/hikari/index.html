<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>光と闇のともしび</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="view"></canvas>

  <div id="bar" hidden>
    <a class="back" href="../../">← メインページへ</a>
    <div id="lvname"></div>
    <div id="moves"></div>
  </div>
  <div id="tools" hidden>
    <button id="btn-hint">ヒント</button>
    <button id="btn-reset">やり直し</button>
    <button id="btn-select">面セレクト</button>
  </div>
  <div id="goal" hidden></div>

  <div id="dialog" hidden>
    <div id="who"></div>
    <div id="text"></div>
    <div id="next">▼ タップ / Space</div>
  </div>

  <div id="title" class="overlay">
    <a class="back" href="../../">← メインページへ</a>
    <div class="big"><span class="k">光</span><span class="y">闇</span></div>
    <h1>光と闇のともしび</h1>
    <p>世界から光が消えて、洞窟は「闇」の字に飲み込まれた。<br>小さな「光」は、奥にある「大きなともしび」を取り戻しに行く。<br>鏡で光をはねかえして、ともしび台に届けよう。</p>
    <div class="btns">
      <button id="btn-continue">つづきから</button>
      <button id="btn-new">はじめから</button>
      <button id="btn-title-select">面セレクト</button>
    </div>
    <p class="help">鏡：ドラッグで移動・タップで45°回転</p>
  </div>

  <div id="select" class="overlay" hidden>
    <a class="back" href="../../">← メインページへ</a>
    <h2>面セレクト</h2>
    <div id="levels"></div>
    <div class="btns"><button id="btn-select-close">もどる</button></div>
  </div>

  <div id="clear" class="overlay clearbox" hidden>
    <h2 id="clear-title">ともしびがついた！</h2>
    <div id="clear-stars"></div>
    <p id="clear-info"></p>
    <div class="btns">
      <button id="btn-next">つぎの面へ</button>
      <button id="btn-again">もういちど</button>
      <button id="btn-clear-select">面セレクト</button>
    </div>
  </div>

  <div id="ending" class="overlay" hidden>
    <div class="pair"><span class="yami">闇</span><span class="hikari">光</span><span class="mei">明</span></div>
    <h1>夜があけた</h1>
    <p>「闇」と「光」はならんで、ひとつの「明」になりました。<br>洞窟のおくの大きなともしびは、あたたかい朝の光になって、世界へひろがっていきます。</p>
    <div class="btns">
      <button id="btn-end-again">もういちど あそぶ</button>
      <button id="btn-end-select">面セレクト</button>
      <a class="btn" href="../../">メインページへ</a>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
