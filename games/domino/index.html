<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>文字ドミノ</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier2d-deterministic-compat@0.21.0/dist/rapier.mjs",
      "opentype": "https://cdn.jsdelivr.net/npm/opentype.js@2.0.0/dist/opentype.mjs",
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <header id="bar">
    <a class="back" href="../../">← メインページへ</a>
    <span id="lv-name"></span>
    <div class="btns">
      <button id="hint">ヒント</button>
      <button id="reset">やり直し</button>
      <button id="levels">面</button>
      <button id="sound" aria-label="音">🔔</button>
    </div>
  </header>

  <div id="banner"></div>

  <div id="dock">
    <div id="card-info"></div>
    <div id="tray-row">
      <div id="tray" aria-label="持ち札"></div>
      <button id="go" disabled>読み込み中…</button>
    </div>
  </div>
  <div id="drag-ghost" hidden></div>

  <div id="select" class="card" hidden>
    <h1>文字ドミノ</h1>
    <p>字をドミノのように立てて並べ、最初の1つを倒して連鎖させ、右の鐘を鳴らそう。<br>字の形で、倒れ方がちがう。</p>
    <div id="grid"></div>
    <div id="total"></div>
    <a href="../../" class="back2">← メインページへ</a>
  </div>

  <div id="result" class="card" hidden>
    <div id="result-title">鐘が鳴った！</div>
    <div id="stars" aria-label="星"></div>
    <div id="result-sub"></div>
    <div class="row">
      <button id="again">もう一度</button>
      <button id="next">次の面へ</button>
      <button id="to-select">面セレクト</button>
    </div>
  </div>

  <div id="msg"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
