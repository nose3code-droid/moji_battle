<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>文字サーキット</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "opentype": "https://cdn.jsdelivr.net/npm/opentype.js@2.0.0/dist/opentype.mjs"
    }
  }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <a id="back" href="../../">← メインページへ</a>

  <div id="hud" hidden>
    <div class="box">
      <div><small>周回</small> <b id="lap">1/3</b></div>
      <div><small>順位</small> <b id="pos">4/4</b></div>
    </div>
    <div class="box times">
      <div><small>タイム</small> <b id="time">0.00</b></div>
      <div><small>ラップ</small> <b id="laptime">0.00</b></div>
      <div><small>ベスト</small> <b id="bestlap">―</b></div>
    </div>
    <ol id="board"></ol>
    <canvas id="mini" width="140" height="110"></canvas>
    <button id="quit" class="sub small">やめる</button>
  </div>
  <div id="count"></div>
  <div id="hint" hidden>左右の画面タッチ / ←→・A D でハンドル　ブレーキ＝ドリフト（Space・↓）　アクセルは自動</div>
  <button id="brake" hidden>ブレーキ<br>ドリフト</button>

  <div id="menu" class="overlay">
    <div class="card">
      <h1>文字サーキット</h1>
      <p class="lead">文字の形がそのままマシンの性能になる。3周で順位を競おう。</p>
      <div class="row">
        <input id="char" type="text" value="〇" maxlength="2" autocomplete="off" aria-label="文字（1〜2文字）">
        <canvas id="preview" width="80" height="80"></canvas>
        <div id="stats"></div>
      </div>
      <div class="row presets" id="presets"></div>
      <div id="trait"></div>
      <h2>コース</h2>
      <div class="row choice" id="tracks"></div>
      <h2>CPUの強さ</h2>
      <div class="row choice" id="diffs"></div>
      <div id="records"></div>
      <div id="rivals"></div>
      <button id="go" disabled>スタート</button>
      <div id="msg">フォント読み込み中…</div>
    </div>
  </div>

  <div id="result" class="overlay" hidden>
    <div class="card">
      <h2 id="r-title"></h2>
      <div id="r-sub"></div>
      <ol id="r-list"></ol>
      <div id="r-times"></div>
      <div class="row">
        <button id="again">もう一度</button>
        <button id="change" class="sub">別の文字・コース</button>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
