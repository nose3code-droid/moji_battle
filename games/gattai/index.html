<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>文字がったい</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier2d-deterministic-compat@0.21.0/dist/rapier.mjs",
      "opentype": "https://cdn.jsdelivr.net/npm/opentype.js@2.0.0/dist/opentype.mjs"
    }
  }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="hud">
    <div id="left">
      <div id="info">
        <a href="../../" class="back">← メインページへ</a>
        <div>スコア <b id="score">0</b></div>
        <div><small>ハイスコア <span id="best">0</span></small></div>
      </div>
      <div id="hint" class="off" aria-live="polite"></div>
    </div>
    <div id="right">
      <div id="next-box">
        <span>つぎ</span>
        <div id="next" class="glyph"></div>
      </div>
      <button id="book-btn">ずかん</button>
    </div>
  </div>

  <div id="title" class="card">
    <h1>文字がったい</h1>
    <p>箱の上から文字を落とそう。<br>同じ字や、決まった組み合わせの字がぶつかると<b>合体</b>して、大きな漢字になる。<br>箱からあふれたらおしまい。</p>
    <p class="hint">画面をタップ／ドラッグして位置を決め、指をはなすと落ちる。<br>キーボードなら ←→ で移動、スペースで落とす。</p>
    <details open>
      <summary>合体ずかん（どの字とどの字がくっつく？）</summary>
      <div class="book" id="book"></div>
    </details>
    <button id="start" disabled>読み込み中…</button>
    <a href="../../" class="back">← メインページへ</a>
  </div>

  <div id="result" class="card" hidden>
    <div id="result-title">あふれた！</div>
    <div id="result-sub"></div>
    <button id="retry">もう一度</button>
    <a href="../../" class="back">← メインページへ</a>
  </div>

  <div id="book-card" class="card" hidden>
    <h2>合体ずかん</h2>
    <div class="book" id="book2"></div>
    <button id="book-close">ゲームにもどる</button>
  </div>

  <div id="msg"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
