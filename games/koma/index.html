<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>文字ゴマ</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier2d-compat@0.21.0/dist/rapier.mjs",
      "opentype": "https://cdn.jsdelivr.net/npm/opentype.js@2.0.0/dist/opentype.mjs"
    }
  }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="tags"></div>

  <div id="panel">
    <div class="title"><b>文字ゴマ</b><a href="../../">← メインページへ</a></div>
    <div class="row">
      <input id="char" type="text" value="米" maxlength="2" autocomplete="off" aria-label="文字">
      <button id="go" disabled>スタジアムへ</button>
    </div>
    <div class="row presets">
      <button data-c="〇">〇</button>
      <button data-c="米">米</button>
      <button data-c="永">永</button>
      <button data-c="口">口</button>
      <button data-c="鬱">鬱</button>
      <button data-c="S">S</button>
    </div>
    <div class="row cpu">
      <span>CPU</span>
      <button data-n="1">1体</button>
      <button data-n="2">2体</button>
      <button data-n="3">3体</button>
    </div>
    <div class="row opp">
      <span>相手</span><span id="opponents"></span>
      <button id="shuffle" class="small">入れ替え</button>
    </div>
    <div id="stats"></div>
  </div>

  <div id="launcher" hidden>
    <div class="row dir">
      <button data-dir="1">⟲ 左回転</button>
      <button data-dir="-1">⟳ 右回転</button>
    </div>
    <div id="gauge"><b></b><span>MAX</span></div>
    <button id="charge">長押しでパワーをためる</button>
    <div class="hint">離すと発射。画面をすばやくスワイプしても発射できます<br>（右へスワイプ＝右回転、速いほど強い）</div>
    <button id="back" class="link">← 文字を選び直す</button>
  </div>

  <div id="hud" hidden>
    <div id="clock">0.0 秒</div>
    <div id="spins"></div>
  </div>
  <div id="spectate" hidden>
    <span>脱落… 観戦中</span>
    <button id="fast" class="small">早送り ▶▶</button>
  </div>
  <div id="count"></div>

  <div id="result" hidden>
    <div id="result-title"></div>
    <div id="result-sub"></div>
    <ol id="standings"></ol>
    <div id="record"></div>
    <div class="row">
      <button id="retry">もう一度</button>
      <button id="change">文字を変える</button>
    </div>
  </div>

  <div id="msg"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
