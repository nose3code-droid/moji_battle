<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>文字そろえ</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "opentype": "https://cdn.jsdelivr.net/npm/opentype.js@2.0.0/dist/opentype.mjs"
    }
  }
  </script>
</head>
<body>
  <header id="bar">
    <a class="back" href="../../">← メインページへ</a>
    <div id="stage-name"></div>
    <div id="moves-box">のこり <b id="moves">0</b> 手</div>
  </header>
  <section id="goals"></section>
  <main id="wrap"><canvas id="view"></canvas></main>
  <footer id="tools">
    <button id="btn-hint">ヒント</button>
    <button id="btn-reset">やり直し</button>
    <button id="btn-select">面セレクト</button>
    <button id="btn-book">ずかん</button>
  </footer>
  <div id="toast"></div>

  <div class="overlay" id="title">
    <div class="card">
      <h1>文字そろえ</h1>
      <p>同じ字を3つそろえて消そう。<br>決まった並びで<b>漢字</b>が完成すると大きなボーナス！</p>
      <p class="hint">となりの字とスワイプ（またはタップ→タップ）で入れ替え</p>
      <div id="stage-grid"></div>
      <div class="row"><button id="title-book">ずかん</button><button id="title-close" hidden>ゲームにもどる</button><span id="load-state">読み込み中…</span></div>
      <a class="back" href="../../">← メインページへ</a>
    </div>
  </div>

  <div class="overlay" id="result" hidden>
    <div class="card">
      <h2 id="result-title"></h2>
      <div id="result-stars"></div>
      <div id="result-sub"></div>
      <div class="row">
        <button id="result-next">つぎの面へ</button>
        <button id="result-retry">もう一度</button>
        <button id="result-select">面セレクト</button>
      </div>
      <a class="back" href="../../">← メインページへ</a>
    </div>
  </div>

  <div class="overlay" id="book" hidden>
    <div class="card wide">
      <h2>漢字ずかん <small id="book-count"></small></h2>
      <div id="book-list"></div>
      <div id="book-special"></div>
      <button id="book-close">とじる</button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
