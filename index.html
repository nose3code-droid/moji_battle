<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文字バトル</title>
  <style>
    :root {
      --bg: #f4f1ea; --card: #fffdf8; --ink: #22252b; --sub: #6b6f78; --line: #e2ddd0;
      --accent: #e8590c; --soon: #a3a7ae;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #17181c; --card: #22242a; --ink: #eceae4; --sub: #9a9ea8; --line: #33363d;
        --accent: #ff8a3d; --soon: #61656e;
      }
    }
    :root[data-theme="dark"] {
      --bg: #17181c; --card: #22242a; --ink: #eceae4; --sub: #9a9ea8; --line: #33363d;
      --accent: #ff8a3d; --soon: #61656e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    }
    main { max-width: 960px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { margin: 0; font-size: clamp(32px, 8vw, 52px); letter-spacing: .12em; }
    .lead { margin: 8px 0 28px; color: var(--sub); line-height: 1.7; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .game {
      display: flex; gap: 14px; align-items: center; padding: 16px;
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      color: inherit; text-decoration: none; transition: transform .12s, border-color .12s;
    }
    a.game:hover, a.game:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
    .glyph {
      flex: none; width: 64px; height: 64px; display: grid; place-items: center;
      font-size: 44px; font-weight: 900; line-height: 1; color: var(--accent);
      border-radius: 12px; background: color-mix(in srgb, var(--accent) 12%, transparent);
    }
    .game h2 { margin: 0 0 4px; font-size: 18px; }
    .game p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--sub); }
    .game.soon { cursor: default; }
    .game.soon .glyph { color: var(--soon); background: color-mix(in srgb, var(--soon) 15%, transparent); }
    .game.soon h2::after { content: "準備中"; margin-left: 8px; padding: 1px 6px; font-size: 11px; font-weight: normal; color: var(--sub); border: 1px solid var(--line); border-radius: 6px; vertical-align: middle; }
  </style>
</head>
<body>
  <main>
    <h1>文字バトル</h1>
    <p class="lead">打った文字の形が、そのまま強さになる。<br>丸い字、とがった字、重たい字――好きな1文字で遊んでみよう。</p>
    <div class="grid" id="games"></div>
  </main>

  <script>
    // 遊べる作品の一覧。path はこのページからの相対パス
    const GAMES = [
      { path: 'race.html',        glyph: '〇', name: '文字ころがしレース', desc: '文字を坂道で転がしてタイムを競う。世界ランキングあり' },
      { path: 'games/sumo/',      glyph: '山', name: '文字ずもう',         desc: '土俵をトントン叩いて、相手の文字を倒すか押し出せば勝ち' },
      { path: 'games/tower/',     glyph: '口', name: '文字タワーバトル',   desc: '交互に文字を積み上げる。塔を崩した方の負け' },
      { path: 'games/catapult/',  glyph: '鬱', name: '文字カタパルト',     desc: 'パチンコで文字を撃って、城の「王」を落とせ' },
      { path: 'games/koma/',      glyph: '米', name: '文字ゴマ',           desc: '文字をコマにして回し合う。最後まで回っていた字の勝ち' },
      { path: 'games/status/',    glyph: '龍', name: '文字ステータス対戦', desc: '形からHPや攻撃が決まる、ターン制のカードバトル' },
      { path: 'games/tobashi/',   glyph: '一', name: '文字とばし',         desc: 'パワーと角度を決めて飛ばし、何メートル飛ぶかを競う' },
      { path: 'games/gattai/',    glyph: '森', name: '文字がったい',       desc: '同じ字をぶつけて合体。木→林→森と大きな漢字を目指す' },
      { path: 'games/bowling/',   glyph: '球', name: '文字ボウリング',     desc: '文字を転がしてピンを倒す。10フレームでハイスコアを狙え' },
      { path: 'games/escape/',    glyph: 'あ', name: 'あ、脱出する',       desc: '閉じ込められた「あ」が5つの部屋を抜けて外へ。物理パズルの脱出ストーリー' },
      { path: 'games/dungeon/',   glyph: '迷', name: '文字ダンジョン',     desc: '画数が体力の冒険者「一」が辞書の迷宮へ。倒した字は仲間になる' },
      { path: 'games/library/',   glyph: '館', name: '夜の文字館',         desc: '閉館後の図書館で「鬱」から逃げながら出口を探す、ほんのりホラー' },
      { path: 'games/hikeshi/',   glyph: '火', name: '火消し大作戦',       desc: '燃え広がる町で、水を操って火を消し住人を助けるレスキュー' },
      { path: 'games/kaminari/',  glyph: '雷', name: '雷よけ',             desc: '稲妻の予告をよけながら走り、雷の神様の落とし物をさがそう' },
      { path: 'games/hikari/',    glyph: '光', name: '光と闇のともしび',   desc: '鏡で光を反射して闇を払う、全10面の光線パズル' },
      { path: 'games/rhythm/',    glyph: '闇', name: '五属性リズム',       desc: '火・水・雷・光・闇の5レーンを叩いて、音の消えた字の都に音楽を取り戻す' },
    ];

    const esc = s => s.replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
    const grid = document.getElementById('games');
    grid.innerHTML = GAMES.map(g => `
      <a class="game" href="${esc(g.path)}" data-path="${esc(g.path)}">
        <span class="glyph" aria-hidden="true">${esc(g.glyph)}</span>
        <span><h2>${esc(g.name)}</h2><p>${esc(g.desc)}</p></span>
      </a>`).join('');

    // まだ公開されていない作品は「準備中」にしてリンクを外す（取り込まれたら自動で遊べるようになる）
    for (const el of grid.querySelectorAll('.game')) {
      fetch(el.dataset.path, { method: 'HEAD' })
        .then(res => { if (!res.ok) markSoon(el); })
        .catch(() => { /* file:// などで確かめられないときはリンクのまま */ });
    }
    function markSoon(el) {
      el.classList.add('soon');
      el.removeAttribute('href');
      el.setAttribute('aria-disabled', 'true');
    }
  </script>
</body>
</html>
