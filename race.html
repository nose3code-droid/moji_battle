<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>文字ころがしレース</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-deterministic-compat@0.21.0/dist/rapier.mjs",
      "opentype": "https://cdn.jsdelivr.net/npm/opentype.js@2.0.0/dist/opentype.mjs"
    }
  }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="panel">
    <div class="row">
      <input id="char" type="text" value="あ" maxlength="2" autocomplete="off" aria-label="文字">
      <button id="go" disabled>転がす</button>
    </div>
    <div class="row presets">
      <button data-c="〇">〇</button>
      <button data-c="あ">あ</button>
      <button data-c="口">口</button>
      <button data-c="木">木</button>
      <button data-c="鬱">鬱</button>
      <button data-c="S">S</button>
    </div>
    <div class="row mode">
      <button data-mode="cpu">CPU対戦</button>
      <button data-mode="ghost">ゴースト対戦</button>
    </div>
    <div class="row opp">
      <span>対戦相手</span><span id="opponents"></span>
      <button id="shuffle" class="small">入れ替え</button>
    </div>
    <div id="stats"></div>
    <button id="rank-toggle" class="link">自己ベスト一覧 ▼</button>
    <div id="rank-box" hidden>
      <ol id="ranking"></ol>
      <button id="reset" class="small danger">記録とゴーストをすべて消す</button>
    </div>
    <button id="world-toggle" class="link">世界ランキング ▼</button>
    <div id="world-box" hidden>
      <ol id="world" class="world"></ol>
    </div>
    <a href="./" class="game-link">← ほかの文字ゲームへ（メインページ）</a>
  </div>

  <div id="hud">
    <div><span id="time">0.00</span> 秒</div>
    <div class="track" id="track"></div>
  </div>
  <div id="count"></div>

  <div id="result" hidden>
    <div id="result-title"></div>
    <div id="result-sub"></div>
    <ol id="standings"></ol>
    <div id="submit-box" hidden>
      <div id="submit-info"></div>
      <div class="row" id="submit-form">
        <input id="name" type="text" placeholder="ニックネーム" autocomplete="nickname">
        <button id="submit">世界ランキングに登録</button>
      </div>
      <ol id="world-result" class="world"></ol>
    </div>
    <div class="row">
      <button id="retry">もう一度</button>
      <button id="change">別の文字</button>
    </div>
  </div>

  <div id="msg"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
